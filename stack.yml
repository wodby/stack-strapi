name: strapi
icon: strapi
title: Strapi
docs: https://wodby.com/docs/2.0/stacks/catalog/strapi/

services:
- name: strapi
  title: Node.js
  service: strapi
  required: true
  volumes:
  - name: uploads
    size: 10
  links:
  - name: db
    service: postgres
  - name: sendmail
    service: mailpit
  - name: otel
    service: otel-collector

- name: postgres
  title: PostgreSQL
  required: true
  service: postgres
  volumes:
  - name: data
    size: 10

- name: mailpit
  disabled: true
  title: Mailpit
  service: mailpit

- name: opensmtpd
  disabled: true
  title: OpenSMTPD
  service: opensmtpd

- name: otel-collector
  title: OpenTelemetry Collector
  service: opentelemetry-collector
  disabled: true
  # The application sends telemetry to the Collector inside the environment only.
  endpoints:
  - name: otlp
    ports:
    - name: otlp-http
      private: true
